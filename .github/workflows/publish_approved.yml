name: Publish Dashboard-Approved Campaign

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the dashboard queue without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: approved-campaign-publishing
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check dashboard approval queue
        id: approval
        env:
          APPROVAL_URL: https://dr-rofe-reputation-center.guyrofe.chatgpt.site
        run: |
          response="$(curl --fail --silent --show-error \
            "${APPROVAL_URL}/api/approvals/next")"
          draft_path="$(jq -r '.draft_path // empty' <<<"${response}")"
          bundle_path="$(jq -r '.bundle_path // empty' <<<"${response}")"
          approval_record_path="$(jq -r '.approval_record_path // empty' <<<"${response}")"
          echo "draft_path=${draft_path}" >> "${GITHUB_OUTPUT}"
          echo "bundle_path=${bundle_path}" >> "${GITHUB_OUTPUT}"
          echo "approval_record_path=${approval_record_path}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${draft_path}" ]] && { [[ -z "${bundle_path}" ]] || [[ -z "${approval_record_path}" ]]; }; then
            echo "::error::Dashboard returned a draft without its signed P7 approval artifacts"
            exit 1
          fi
          [[ -z "${draft_path}" ]] || echo "Signed P7 campaign ready: ${draft_path}"

      - name: Install dependencies
        if: >-
          steps.approval.outputs.draft_path != '' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: pip install -r requirements.txt

      - name: Publish approved campaign
        if: >-
          steps.approval.outputs.draft_path != '' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: python scripts/campaign_run.py
        env:
          DRAFT_PATH: ${{ steps.approval.outputs.draft_path }}
          APPROVAL_BUNDLE_PATH: ${{ steps.approval.outputs.bundle_path }}
          APPROVAL_RECORD_PATH: ${{ steps.approval.outputs.approval_record_path }}
          APPROVAL_SIGNING_SECRET: ${{ secrets.APPROVAL_SIGNING_SECRET }}
          WORDPRESS_GUYROFE_COM_USER: ${{ secrets.WORDPRESS_GUYROFE_COM_USER }}
          WORDPRESS_GUYROFE_COM_API: ${{ secrets.WORDPRESS_GUYROFE_COM_API }}
          WORDPRESS_DRGUYROFE_CO_IL_USER: ${{ secrets.WORDPRESS_DRGUYROFE_CO_IL_USER }}
          WORDPRESS_DRGUYROFE_CO_IL_API: ${{ secrets.WORDPRESS_DRGUYROFE_CO_IL_API }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          X_PUBLISHING_ENABLED: 'false'
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
          TUMBLR_BLOG_NAME: ${{ secrets.TUMBLR_BLOG_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}

      - name: Commit campaign receipt
        if: >-
          success() && steps.approval.outputs.draft_path != '' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name "dr-rofe-pr-agent"
          git config user.email "actions@github.com"
          git add content_drafts/campaigns/ publication_receipts/
          git diff --cached --quiet || git commit -m "Record approved campaign ${{ github.run_id }}"
          git pull --rebase
          git push

      - name: Upload campaign diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-${{ github.run_id }}
          path: run_log.txt
          if-no-files-found: ignore
          retention-days: 30
