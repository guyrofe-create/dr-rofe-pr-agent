name: Publish Dashboard-Approved Content (Paused)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the dashboard connection without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy Medium-only publisher is paused
        run: |
          echo "Medium-only publication is paused while the unified campaign publisher is deployed."
