name: Publish Dashboard-Approved Campaign
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run
      && 'CHECK ONLY — dashboard-approved campaign'
      || 'PUBLISH — dashboard-approved campaign' }}

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check only — do not publish the signed approved campaign
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: approved-campaign-publishing
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check dashboard approval queue
        id: approval
        env:
          APPROVAL_URL: https://dr-rofe-reputation-center.guyrofe.chatgpt.site
          APPROVAL_SIGNING_SECRET: ${{ secrets.APPROVAL_SIGNING_SECRET }}
        run: |
          response_path="${RUNNER_TEMP}/dashboard-approval-response.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${APPROVAL_SIGNING_SECRET}" \
            "${APPROVAL_URL}/api/approvals/next" > "${response_path}"
          draft_path="$(jq -r '.draft_path // empty' "${response_path}")"
          bundle_path="${RUNNER_TEMP}/p7-bundle.json"
          approval_record_path="${RUNNER_TEMP}/p7-approval.json"
          approved_media_path=""
          if [[ -n "${draft_path}" ]]; then
            jq -e '.bundle' "${response_path}" > "${bundle_path}"
            jq -e '.approval_record' "${response_path}" > "${approval_record_path}"
            if jq -e '.media_payload.base64' "${response_path}" >/dev/null; then
              content_type="$(jq -r '.media_payload.content_type' "${response_path}")"
              case "${content_type}" in
                image/png) extension="png" ;;
                image/webp) extension="webp" ;;
                image/jpeg) extension="jpg" ;;
                *) echo "::error::Unsupported approved image type"; exit 1 ;;
              esac
              approved_media_path="${RUNNER_TEMP}/approved-media.${extension}"
              jq -r '.media_payload.base64' "${response_path}" \
                | base64 --decode > "${approved_media_path}"
              expected_sha="$(jq -r '.media_payload.sha256' "${response_path}")"
              actual_sha="$(sha256sum "${approved_media_path}" | cut -d' ' -f1)"
              if [[ "${expected_sha}" != "${actual_sha}" ]]; then
                echo "::error::Dashboard image bytes failed SHA-256 verification"
                exit 1
              fi
            fi
          else
            bundle_path=""
            approval_record_path=""
          fi
          echo "draft_path=${draft_path}" >> "${GITHUB_OUTPUT}"
          echo "bundle_path=${bundle_path}" >> "${GITHUB_OUTPUT}"
          echo "approval_record_path=${approval_record_path}" >> "${GITHUB_OUTPUT}"
          echo "approved_media_path=${approved_media_path}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${draft_path}" ]] && { [[ -z "${bundle_path}" ]] || [[ -z "${approval_record_path}" ]]; }; then
            echo "::error::Dashboard returned a draft without its signed P7 approval artifacts"
            exit 1
          fi
          [[ -z "${draft_path}" ]] || echo "Signed P7 campaign ready: ${draft_path}"

      - name: Report execution mode
        if: always()
        env:
          DRAFT_PATH: ${{ steps.approval.outputs.draft_path }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "### CHECK ONLY — no publication was attempted" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### PUBLISH MODE — signed dashboard approval required" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -n "${DRAFT_PATH}" ]]; then
            echo "Approved campaign found: \`${DRAFT_PATH}\`" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No approved campaign was waiting in the dashboard queue." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Install dependencies
        if: >-
          steps.approval.outputs.draft_path != '' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: pip install -r requirements.txt

      - name: Publish approved campaign
        if: >-
          steps.approval.outputs.draft_path != '' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: python scripts/campaign_run.py
        env:
          DRAFT_PATH: ${{ steps.approval.outputs.draft_path }}
          APPROVAL_BUNDLE_PATH: ${{ steps.approval.outputs.bundle_path }}
          APPROVAL_RECORD_PATH: ${{ steps.approval.outputs.approval_record_path }}
          APPROVED_MEDIA_PATH: ${{ steps.approval.outputs.approved_media_path }}
          APPROVAL_SIGNING_SECRET: ${{ secrets.APPROVAL_SIGNING_SECRET }}
          WORDPRESS_GUYROFE_COM_USER: ${{ secrets.WORDPRESS_GUYROFE_COM_USER }}
          WORDPRESS_GUYROFE_COM_API: ${{ secrets.WORDPRESS_GUYROFE_COM_API }}
          WORDPRESS_DRGUYROFE_CO_IL_USER: ${{ secrets.WORDPRESS_DRGUYROFE_CO_IL_USER }}
          WORDPRESS_DRGUYROFE_CO_IL_API: ${{ secrets.WORDPRESS_DRGUYROFE_CO_IL_API }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          X_PUBLISHING_ENABLED: 'false'
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
          TUMBLR_BLOG_NAME: ${{ secrets.TUMBLR_BLOG_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}

      - name: Commit campaign receipt
        if: >-
          always() && steps.approval.outputs.draft_path != '' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name "dr-rofe-pr-agent"
          git config user.email "actions@github.com"
          git add content_drafts/campaigns/ publication_receipts/
          git diff --cached --quiet || git commit -m "Record approved campaign ${{ github.run_id }}"
          git pull --rebase
          git push

      - name: Report publication results
        if: >-
          always() && steps.approval.outputs.draft_path != '' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          DRAFT_PATH: ${{ steps.approval.outputs.draft_path }}
        run: |
          result_path="content_drafts/campaigns/$(basename "${DRAFT_PATH}" .md).json"
          if [[ ! -f "${result_path}" ]]; then
            echo "### הפרסום נכשל לפני שנוצר דוח תוצאות" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "## דוח הפצה"
            echo
            echo "| יעד | סטטוס | קישור / פירוט |"
            echo "|---|---|---|"
            jq -r '.destinations[] | "| \(.name) | \(.status) | " + (if .url then "[פתיחה ↗](\(.url))" else (.detail // "—") end) + " |"' "${result_path}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload campaign diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-${{ github.run_id }}
          path: run_log.txt
          if-no-files-found: ignore
          retention-days: 30
