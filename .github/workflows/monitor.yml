name: Dr. Rofe Reputation Monitor

on:
  schedule:
    - cron: '30 4 1,15 * *'
  workflow_dispatch:
    inputs:
      force_search_console:
        description: Collect a fresh 28-day query/page snapshot now
        required: true
        default: false
        type: boolean

permissions:
  issues: write
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Monitor
        run: python scripts/monitor_run.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPI_API }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
          MEDIUM_SID: ${{ secrets.MEDIUM_SID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          X_PUBLISHING_ENABLED: 'false'
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
          TUMBLR_BLOG_NAME: ${{ secrets.TUMBLR_BLOG_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          FORCE_SEARCH_CONSOLE_CHECK: ${{ inputs.force_search_console || 'false' }}

      - name: Prepare highest-ranked P4 actions for review
        if: always()
        run: python scripts/prepare_opportunities.py

      - name: Commit reputation state
        if: always()
        run: |
          git config user.name "dr-rofe-pr-agent"
          git config user.email "actions@github.com"
          git add data/reputation_history.json data/command_center.json opportunity_drafts/ || true
          git add data/ai_usage_events/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update reputation state $(date +%Y-%m-%d\ %H:%M)"
          git pull --rebase || true
          git push || true

      - name: Build the exact twice-monthly asset rank report
        if: always()
        run: >-
          python scripts/weekly_email_report.py
          --days 16
          --html-output asset-rank-report.html
          --dry-run

      - name: Upload monitor report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitor-report-${{ github.run_id }}
          path: monitor_report.json
          retention-days: 90

      - name: Upload asset rank report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asset-rank-report-${{ github.run_id }}
          path: asset-rank-report.html
          if-no-files-found: warn
          retention-days: 90
