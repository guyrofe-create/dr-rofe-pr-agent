name: Publication Watchdog

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Dashboard-Approved Campaign"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    # Successful five-minute queue polls contain no new incident. The daily
    # audit and failed publisher runs remain visible in Actions and artifacts.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Verify recent publication receipts
        run: |
          hours=30
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then hours=6; fi
          python scripts/publication_watchdog.py --hours "${hours}" --output publication_watchdog_report.json
          echo '## Publication watchdog' >> "${GITHUB_STEP_SUMMARY}"
          echo '```json' >> "${GITHUB_STEP_SUMMARY}"
          jq '.totals' publication_watchdog_report.json >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: publication-watchdog-${{ github.run_id }}
          path: publication_watchdog_report.json
          retention-days: 30
