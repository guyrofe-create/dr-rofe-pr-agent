name: Publication Watchdog (temporary)

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the watchdog report by email
        required: true
        default: true
        type: boolean
  workflow_run:
    workflows: ["Publish Dashboard-Approved Campaign"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    # Scheduled publisher checks are intentionally frequent, but most runs are
    # empty queue checks. Only inspect an immediate workflow_run when the
    # publisher itself failed; the daily run still audits partial receipts.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Verify recent publication receipts
        env:
          PUBLICATION_EMAIL_TO: guyrofe@gmail.com
          PUBLICATION_EMAIL_GMAIL_USERNAME: guyrofe@gmail.com
          PUBLICATION_EMAIL_GMAIL_APP_PASSWORD: ${{ secrets.WEEKLY_REPORT_GMAIL_APP_PASSWORD }}
          SEND_DAILY_EMAIL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email) }}
        run: |
          hours=30
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then hours=6; fi
          email_arg=""
          if [[ "${SEND_DAILY_EMAIL}" == "true" ]]; then email_arg="--send-email"; fi
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then email_arg="--send-email-on-problem"; fi
          watchdog_status=0
          python scripts/publication_watchdog.py --hours "${hours}" --output publication_watchdog_report.json --fail-on-problem ${email_arg} || watchdog_status=$?
          echo '## Publication watchdog' >> "${GITHUB_STEP_SUMMARY}"
          echo '```json' >> "${GITHUB_STEP_SUMMARY}"
          jq '.totals' publication_watchdog_report.json >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          exit "${watchdog_status}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: publication-watchdog-${{ github.run_id }}
          path: publication_watchdog_report.json
          retention-days: 30
