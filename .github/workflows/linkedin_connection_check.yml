name: LinkedIn Connection Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linkedin_connection_check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Verify LinkedIn OAuth and member identity
        run: python scripts/linkedin_connection_check.py
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
