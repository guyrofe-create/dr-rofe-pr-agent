name: Facebook Product Publish Test

on:
  push:
    paths:
      - '.github/workflows/facebook_publish_test.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish explicitly approved Facebook test
        run: python scripts/facebook_publish.py
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_POST_URL: https://guyrofe.com
          FACEBOOK_POST_TEXT: >-
            כאבי מחזור חזקים אינם תמיד משהו שצריך פשוט להשלים איתו.
            כאשר הכאב פוגע בתפקוד, מחמיר עם הזמן או מלווה בכאב ביחסי מין,
            ביציאות או במתן שתן — כדאי לפנות לבירור רפואי מסודר.
            אבחון נכון יכול לקצר את הדרך לטיפול המתאים.
