name: One-time full publication audit
on:
  push:
    paths:
      - '.github/workflows/publication_audit_once_20260917.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Check recorded publication URLs
        run: |
          python - <<'PY'
          import concurrent.futures, glob, html, json, re
          import requests
          from collections import Counter
          from urllib.parse import urlparse
          items=[]
          for path in glob.glob('content_drafts/campaigns/*.json'):
              if path.endswith('/index.json'): continue
              try: record=json.load(open(path,encoding='utf-8'))
              except Exception: continue
              for dest in record.get('destinations',[]):
                  if dest.get('status')=='published' and dest.get('url'):
                      items.append({'receipt':path,'target':dest['name'],'url':dest['url'],'title':record.get('title','')})
          def check(item):
              result=dict(item)
              try:
                  response=requests.get(item['url'],timeout=12,allow_redirects=True,headers={'User-Agent':'Mozilla/5.0 (compatible; PublicationAudit/1.0)'})
                  result.update(http=response.status_code,final_url=response.url)
                  body=html.unescape(re.sub(r'<[^>]+>',' ',response.text))
                  title=item['title'].split('|')[0].strip()
                  if response.status_code==200 and title and title[:20] in body:
                      result['verification']='title_observed'
                  elif response.status_code==200 and any(x in body.lower() for x in ('captcha','checking the site connection security','log in','sign in')):
                      result['verification']='access_challenge'
                  elif response.status_code==200:
                      result['verification']='live_page_content_unconfirmed'
                  elif response.status_code in (404,410):
                      result['verification']='missing'
                  else:
                      result['verification']='http_error_or_access_restricted'
              except Exception as exc:
                  result['verification']='request_inconclusive'
                  result['detail']=type(exc).__name__+': '+str(exc)[:160]
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              results=list(pool.map(check,items))
          summary=Counter((urlparse(x['url']).netloc,x['verification']) for x in results)
          report={'checked':len(results),'summary':{' | '.join(k):v for k,v in sorted(summary.items())},'results':results}
          with open('full_publication_audit.json','w',encoding='utf-8') as out:json.dump(report,out,ensure_ascii=False,indent=2)
          print(json.dumps({'checked':len(results),'summary':report['summary']},ensure_ascii=False,indent=2))
          PY
      - name: Verify Facebook and Blogger through owner APIs
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          python - <<'PY'
          import json, os, requests
          from urllib.parse import urlsplit
          from scripts.social_publishers.google_oauth import refresh_access_token
          report=json.load(open('full_publication_audit.json',encoding='utf-8'))
          results=[]
          facebook=[x for x in report['results'] if x['target']=='Facebook']
          token=os.environ.get('FACEBOOK_PAGE_TOKEN','')
          for item in facebook:
              post_id=urlsplit(item['url']).path.rstrip('/').split('/')[-1]
              row={'url':item['url'],'target':'Facebook','verification':'unconfirmed'}
              if token and post_id:
                  try:
                      response=requests.get('https://graph.facebook.com/v25.0/'+post_id,params={'fields':'id,permalink_url,message','access_token':token},timeout=15)
                      data=response.json()
                      row['http']=response.status_code
                      if response.ok and str(data.get('id','')).split('_')[-1]==post_id:
                          row['verification']='provider_object_confirmed'
                          row['provider_permalink']=data.get('permalink_url')
                      else:
                          row['verification']='provider_read_inconclusive'
                  except Exception:
                      row['verification']='provider_read_inconclusive'
              results.append(row)
          blogger=[x for x in report['results'] if x['target']=='Blogger']
          blog_id=os.environ.get('BLOGGER_BLOG_ID','')
          pages=[]
          blogger_status='unavailable'
          if blog_id:
              try:
                  access=refresh_access_token()
                  page_token=None
                  while True:
                      params={'maxResults':500,'fetchBodies':False}
                      if page_token:params['pageToken']=page_token
                      response=requests.get('https://www.googleapis.com/blogger/v3/blogs/'+blog_id+'/posts',headers={'Authorization':'Bearer '+access},params=params,timeout=25)
                      response.raise_for_status()
                      data=response.json()
                      pages.extend(data.get('items') or [])
                      page_token=data.get('nextPageToken')
                      if not page_token:break
                  blogger_status='readable'
              except Exception:
                  blogger_status='unavailable'
          known={x.get('url','').rstrip('/'):x for x in pages}
          for item in blogger:
              post=known.get(item['url'].rstrip('/'))
              results.append({'url':item['url'],'target':'Blogger','verification':'provider_object_confirmed' if post else 'provider_read_inconclusive','provider_id':post.get('id') if post else None})
          summary={}
          for row in results:
              key=row['target']+' | '+row['verification']
              summary[key]=summary.get(key,0)+1
          with open('provider_publication_audit.json','w',encoding='utf-8') as out:json.dump({'summary':summary,'blogger_api':blogger_status,'results':results},out,ensure_ascii=False,indent=2)
          print(json.dumps({'summary':summary,'blogger_api':blogger_status},ensure_ascii=False))
          PY
      - name: Match Facebook receipts against Page published posts
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python - <<'PY'
          import json,os,requests
          from urllib.parse import urlsplit
          token=os.environ.get('FACEBOOK_PAGE_TOKEN','')
          page=os.environ.get('FACEBOOK_PAGE_ID','')
          receipts=[x for x in json.load(open('full_publication_audit.json',encoding='utf-8'))['results'] if x['target']=='Facebook']
          posts=[]
          error=None
          if page and token:
              after=None
              for _ in range(10):
                  params={'fields':'id,permalink_url,created_time,attachments{target{id},url}','limit':100,'access_token':token}
                  if after:params['after']=after
                  try:
                      response=requests.get('https://graph.facebook.com/v25.0/'+page+'/published_posts',params=params,timeout=25)
                      if not response.ok:
                          error='HTTP '+str(response.status_code)
                          break
                      payload=response.json()
                      posts.extend(payload.get('data') or [])
                      after=((payload.get('paging') or {}).get('cursors') or {}).get('after')
                      if not after or not payload.get('data'):break
                  except Exception as exc:
                      error=type(exc).__name__
                      break
          results=[]
          for item in receipts:
              wanted=urlsplit(item['url']).path.rstrip('/').split('/')[-1]
              matches=[]
              for post in posts:
                  pid=str(post.get('id') or '')
                  targets=[str((a.get('target') or {}).get('id') or '') for a in (post.get('attachments') or {}).get('data',[])]
                  if wanted==pid.split('_')[-1] or wanted in targets or wanted in str(post.get('permalink_url') or '').split('/'):
                      matches.append(post)
              result={'url':item['url'],'verification':'provider_object_confirmed' if len(matches)==1 else 'ambiguous_or_not_found','matches':len(matches)}
              if len(matches)==1:result['provider_post_id']=matches[0].get('id')
              results.append(result)
          report={'posts_scanned':len(posts),'error':error,'confirmed':sum(x['verification']=='provider_object_confirmed' for x in results),'results':results}
          with open('facebook_page_audit.json','w',encoding='utf-8') as out:json.dump(report,out,ensure_ascii=False,indent=2)
          print(json.dumps({'posts_scanned':report['posts_scanned'],'error':error,'confirmed':report['confirmed'],'total':len(results)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-publication-audit
          path: |
            full_publication_audit.json
            provider_publication_audit.json
            facebook_page_audit.json
          retention-days: 7
