name: Regenerate Daily Review Images

on:
  workflow_dispatch:
    inputs:
      draft_date:
        description: Draft date to regenerate (YYYY-MM-DD)
        required: true
        type: string
      topic_numbers:
        description: Optional comma-separated topic numbers, for example 01,02,03
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-review-image-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate requested date
        run: |
          if [[ ! "${{ inputs.draft_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::draft_date must use YYYY-MM-DD"
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate every review image for the date
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRAFT_DATE: ${{ inputs.draft_date }}
          TOPIC_NUMBERS: ${{ inputs.topic_numbers }}
        run: |
          shopt -s nullglob
          drafts=(content_drafts/"${DRAFT_DATE}"-*.md)
          if (( ${#drafts[@]} == 0 )); then
            echo "::error::No drafts found for ${DRAFT_DATE}"
            exit 1
          fi
          if [[ -n "${TOPIC_NUMBERS}" && ! "${TOPIC_NUMBERS}" =~ ^[0-9]{2}(,[0-9]{2})*$ ]]; then
            echo "::error::topic_numbers must contain two-digit values separated by commas"
            exit 1
          fi
          selected=0
          for draft_path in "${drafts[@]}"; do
            draft_name="$(basename "${draft_path}")"
            if [[ ! "${draft_name}" =~ -topic-([0-9]{2})- ]]; then
              continue
            fi
            topic_number="${BASH_REMATCH[1]}"
            if [[ -n "${TOPIC_NUMBERS}" && ",${TOPIC_NUMBERS}," != *",${topic_number},"* ]]; then
              continue
            fi
            selected=$((selected + 1))
            echo "Regenerating reviewed visual package for ${draft_path}"
            python scripts/prepare_approval_bundle.py \
              "${draft_path}" \
              --find-licensed-image \
              --replace-existing-image-only \
              --result-path "${RUNNER_TEMP}/$(basename "${draft_path}").json"
            git config user.name "dr-rofe-pr-agent"
            git config user.email "actions@github.com"
            git add approval_bundles/
            if ! git diff --cached --quiet; then
              git commit -m "Regenerate review image $(basename "${draft_path}")"
              git pull --rebase
              git push
            fi
          done
          if (( selected == 0 )); then
            echo "::error::No drafts matched topic_numbers=${TOPIC_NUMBERS}"
            exit 1
          fi

      - name: Show review link
        run: |
          {
            echo "## כל תמונות הטיוטות הוחלפו"
            echo
            echo "[פתח את מרכז האישורים](https://dr-rofe-reputation-center.guyrofe.chatgpt.site)"
            echo
            echo "כל תמונה עברה בדיקת התאמה לנושא, היעדר מלל, היעדר דימויי הריון שגויים ובטיחות רפואית לפני שנכנסה לחבילת האישור."
          } >> "${GITHUB_STEP_SUMMARY}"
