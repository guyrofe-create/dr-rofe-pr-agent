name: Start Full Content Campaign
run-name: CREATE → REVIEW → APPROVE → PUBLISH

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate a manually requested review draft
        id: generate
        run: python scripts/daily_run.py
        env:
          RUN_MODE: generate
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GENERATED_DRAFT_PATH_FILE: ${{ runner.temp }}/generated-draft-path.txt

      - name: Prepare licensed real-photo package
        run: |
          draft_path="$(cat "${RUNNER_TEMP}/generated-draft-path.txt")"
          if [[ -z "${draft_path}" ]] || [[ ! -f "${draft_path}" ]]; then
            echo "::error::This run did not produce its own review draft"
            exit 1
          fi
          python scripts/prepare_approval_bundle.py "${draft_path}" --find-licensed-image
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit draft and immutable approval package
        run: |
          git config user.name "dr-rofe-pr-agent"
          git config user.email "actions@github.com"
          git add content_drafts/ approval_bundles/
          git diff --cached --quiet || git commit -m "Update reviewed content workflow ${{ github.run_id }}"
          git pull --rebase
          git push

      - name: Continue in approval dashboard
        run: |
          {
            echo "## הטיוטה וחבילת האישור מוכנות"
            echo
            echo "1. [פתח את מרכז האישורים](https://dr-rofe-reputation-center.guyrofe.chatgpt.site)"
            echo "2. בדוק את הטקסט, כל גרסאות התמונה ללא מלל, ה-alt, הרישיון והייחוס כאשר נדרש, המקורות ויעדי הפרסום."
            echo "3. אשר את כל הסעיפים ולחץ **אישור והפצה לכל הערוצים**."
            echo
            echo "המוצר מחפש צילום חינמי רלוונטי עם רישיון מתאים. אין יצירת תמונות ב-AI. אם לא נמצא צילום שעבר בדיקת רישיון, התאמה ובטיחות, ההרצה נעצרת ואינה מעבירה תמונה גרועה לאישור."
            echo
            echo "לאחר האישור ההפצה תתחיל אוטומטית בתוך עד 5 דקות. תוצאות וקישורים יוצגו במרכז האישורים."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-${{ github.run_id }}
          path: |
            run_log.txt
          retention-days: 30
