name: Publish Owner-Approved LinkedIn Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linkedin_approved_test_publish.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Publish exact owner-approved text
        run: python scripts/linkedin_publish.py
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CONFIRM_PUBLISH: 'true'
          LINKEDIN_POST_TEXT: |-
            כאבי מחזור חזקים אינם תמיד משהו שצריך פשוט להשלים איתו.
            כאשר הכאב פוגע בתפקוד, מחמיר עם הזמן או מלווה בכאב ביחסי מין, ביציאות או במתן שתן — כדאי לפנות לבירור רפואי מסודר. אבחון נכון יכול לקצר את הדרך לטיפול המתאים.

            מידע נוסף: https://guyrofe.com
